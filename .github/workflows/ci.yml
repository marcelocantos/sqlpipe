name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install cv
        run: |
          CV_VERSION="0.10.0"
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   ASSET="cv-${CV_VERSION}-linux-amd64.tar.gz" ;;
            Linux-ARM64) ASSET="cv-${CV_VERSION}-linux-arm64.tar.gz" ;;
            macOS-ARM64) ASSET="cv-${CV_VERSION}-darwin-arm64.tar.gz" ;;
            *) echo "Unsupported: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/marcelocantos/mk/releases/download/v${CV_VERSION}/${ASSET}" \
            | tar xz -C /usr/local/bin cv

      - name: Build and test
        run: cv test

      # README advertises `cv example` as the first-run command, but nothing
      # else in CI compiles examples/loopback.cpp against the public headers,
      # so an API change could (and did) leave the advertised demo unbuildable.
      - name: Build and run the loopback example
        run: cv example

  vendor-lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The Go and Swift wrapper packages vendor copies of dist/sqlpipe.{h,cpp}
      # and the C-API shim so they build standalone. Nothing else in CI compares
      # those copies against their sources, so a stale one — e.g. a header
      # missing a struct field — could ship silently. This asserts lockstep.
      - name: Check vendored wrapper copies are in lockstep
        run: scripts/check-vendor-lockstep.sh

      # The Go C-API and the emscripten Wasm shim are two hand-written encoders
      # for the same core types. Nothing else compares them, so one could (and
      # did) drop a field the other emits, giving the same value two wire
      # encodings.
      - name: Check the two FFI shims encode results identically
        run: scripts/check-ffi-framing.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Go test
        run: cd go/sqlpipe && go test ./...

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Builds the Swift package (CSqlpipe compiles the bundled sqlpipe.cpp +
      # vendored deepparser). Not covered by `cv test`, so a vendoring gap here
      # cannot ship silently.
      - name: Swift build
        run: cd swift && swift build

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install cv
        run: |
          CV_VERSION="0.10.0"
          curl -fsSL "https://github.com/marcelocantos/mk/releases/download/v${CV_VERSION}/cv-${CV_VERSION}-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin cv

      - uses: mymindstorm/setup-emsdk@v14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Compile the Wasm module — this exercises the emscripten FFI shim
      # (web/sqlpipe_wapi.cpp), which the `cv test` job does not build, so a
      # stale-API break there cannot ship silently — then run the TS smoke test.
      - name: Build Wasm
        run: cv wasm

      - name: TypeScript smoke test
        run: |
          cd web
          npm install
          npx tsc
          node dist/test/smoke.test.js

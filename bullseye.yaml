  T15:
    name: Diff sync identifies rows by PRIMARY KEY, never conflating rowid identity across databases
    status: achieved
    value: 13.0
    cost: 3.0
    acceptance:
    - 'Add a test in tests/test_diff_sync.cpp: create `t(id TEXT PRIMARY KEY, v TEXT)` on both sides; insert {''a'',''b''} on master (rowids 1,2); on replica insert+delete a dummy row to advance the rowid counter, then insert {''a'',''b''} (rowids differ from master); run sync_handshake(master,replica); assert `SELECT id,v FROM t ORDER BY id` is equal and non-empty on both. Before fix: replica table is emptied (assert fails). After fix (a): the non-alias-PK table is rejected at construction with ErrorCode::WithoutRowidTable-style error; after fix (b): both sides converge.'
    - A regression test covering this case exists and passes
    context: Prevents silent, permanent loss of rows the master holds on content-identical tables whose PK is not an INTEGER-PRIMARY-KEY rowid alias, during the routine diff-sync repair path (replica falsely reports Live/in-sync). Found by Fable-5 audit 2026-07 (docs/audit/fable-2026-07.md).
    origin: manual
    discovered: 2026-07-02
    achieved: 2026-07-05
  T16:
    name: Master auto-flush never streams uncommitted or rolled-back rows to replicas
    status: achieved
    value: 13.0
    cost: 3.0
    acceptance:
    - 'Before: compile the repro (c++ -std=c++23 -DSQLITE_ENABLE_SESSION -DSQLITE_ENABLE_PREUPDATE_HOOK -DSQLITE_ENABLE_DESERIALIZE -Idist -Ivendor/include repro_flush.cpp build/libsqlpipe.a) — it prints ''received=1 ... LEAKED changeset seq=2 ... persisted seq=1 ... RESULT: BUG''. The repro does exec(INSERT committed) then BEGIN/INSERT/ROLLBACK and checks received.empty(). After the fix, received must be empty, master.current_seq() must stay 1, and persisted seq must equal 1. Add this as a doctest case in tests/test_master.cpp next to ''on_flush transaction rollback produces nothing'' (that existing test misses the bug because it never does a prior committed write, so flush_pending starts false).'
    - A regression test covering this case exists and passes
    context: Prevents permanent replica divergence and seq desync caused by flush_pending never being reset, which streams a later (uncommitted, rolled-back) statement's rows downstream after any committed write. Found by Fable-5 audit 2026-07 (docs/audit/fable-2026-07.md).
    origin: manual
    discovered: 2026-07-02
    achieved: 2026-07-05
  T17:
    name: Diff sync honors each transmitted bucket_hi so a bucket_size mismatch never leaves rows un-diffed
    status: achieved
    value: 8.0
    cost: 3.0
    acceptance:
    - 'Add a test in tests/test_diff_sync.cpp: same schema T(id INTEGER PRIMARY KEY, v), MasterConfig.bucket_size=1024, ReplicaConfig.bucket_size=4096; populate replica rowid 1..4000, leave master empty; run sync_handshake(master, replica); assert SELECT COUNT(*) FROM T on the replica == 0. Before fix the count is 2977; after fix it is 0.'
    - A regression test covering this case exists and passes
    context: 'Prevents silent, permanent divergence when master and replica are configured with different bucket_size: the master recomputes each requested range from its own bucket_size and discards the transmitted bucket_hi, truncating NeedBucketRanges. Found by Fable-5 audit 2026-07 (docs/audit/fable-2026-07.md).'
    origin: manual

  T35:
    name: 'sqlpipe has a shared-file mode: two processes on one local SQLite database, with the pipe carrying change signals rather than changesets'
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A documented mode in which both peers open the same local SQLite file and the pipe carries only commit signals (table, version) that wake the receiver to re-query. No changesets are extracted or applied in this mode, and the receiver never polls.
    - 'Table ownership is enforced per connection, not by convention: each peer installs an authorizer that refuses writes to tables it does not own, and a violation surfaces as a typed error to the offending writer.'
    - 'Contention is designed in, not left to defaults: WAL mode, short write transactions, a declared busy-timeout policy, and a checkpoint policy that a long-held reader cannot starve. A test with two OS processes writing their own tables concurrently and reading each other''s shows no lock error, no lost row and bounded WAL growth.'
    - The mode is refused on filesystems where SQLite locking is unreliable (network mounts), and the existing two-database mode remains the default and unchanged.
    context: 'Owner 2026-10-19, during the Jevons/Claudia control-plane cleanup (Jevons 🎯T1074.9): sqlpipe''s core design is a pair of databases at opposite ends of the pipe, but in principle it need not require two databases; it could run with shared data and the pipe used only for signalling. The hard part is exactly what the Jevons/Claudia integration hit: two processes getting in each other''s way on one SQLite file ("database is locked" on control-plane writes, gate 4c638044). That integration had shared the file by accident, with neither the pair nor the sharing discipline. Owner decision: treat shared-file mode as an advanced enhancement for later, and do not debug contention at the same time as the Jevons/Claudia interactions; the integration uses the two-database mode now. Same-host only. SQLite''s update_hook is per-process, which is why a signal channel is needed instead of polling PRAGMA data_version.'
    tags:
    - enhancement
    - deferred
    - design
    origin: manual

    context: Prevents a ~150-million-x memory-amplification DoS and a contract-violating uncaught std::bad_alloc/negative dstCapacity when read_changeset (and go/sqlpipe/compress.go) allocate from an unvalidated wire-supplied decompressed length. Found by Fable-5 audit 2026-07 (docs/audit/fable-2026-07.md).
    origin: manual

  T18:
    name: Changeset decompression validates the wire-supplied length before allocating and throws only sqlpipe::Error (C++ and Go)
    status: achieved
    value: 8.0
    cost: 3.0
    acceptance:
    - 'Before: build the fuzzer (`mk fuzz`) and feed the 27-byte input above (or add a doctest calling `deserialize` on it); observe a multi-GB RSS spike / std::bad_alloc that is not caught as sqlpipe::Error (fuzzer aborts). After: the same input throws sqlpipe::Error(ProtocolError) and the fuzzer/test treats it as expected malformed input with no large allocation.'

  T12:
    name: Diff sync performance is characterised and acceptable at scale
    status: identified
    value: 8.0
    cost: 3.0
    acceptance:
    - Benchmark suite covering diff sync with 1k, 10k, 100k, and 1M rows
    - Diff sync with 10k rows and no differences completes in under 1 second
    - Diff sync with 10k rows and continuous writes (1 write/500ms) converges within 5 seconds
    - Reconnect after accumulating 10k rows while disconnected completes diff sync without stalling
    - Results documented with baseline numbers for regression tracking
    context: The SRE dashboard demo revealed that diff sync stalls when the dataset grows during a session (the server generates data continuously, and reconnecting a replica triggers a diff sync that may never converge if writes continue during the handshake). The bucket hashing protocol is designed for O(d+b) efficiency, but the interaction between ongoing writes and the multi-round-trip handshake needs validation. Flush-during-handshake may be the root cause.
    origin: manual
    discovered: 2026-04-06
    achieved: 2026-04-07
  T13:
    name: sqlpipe Go wrapper exposes FTS5, sqlift Go bindings, and automatic sqldeep transpilation so Go consumers can use the same Database API the C++ side already provides
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'go/sqlpipe/wrapper.go cgo CFLAGS/CXXFLAGS include -DSQLITE_ENABLE_FTS5; a test creates a virtual FTS5 table via OpenDatabase and inserts/queries successfully (currently fails with ''no such module: fts5'').'
    - 'Go-level sqlift binding exists: OpenDatabase(path, schemaDDL) constructor that mirrors the C++ Database(path, schema_ddl) sqlift-driven migration, or an explicit (*Database).Migrate(schemaDDL string) error method calling sqlift_db_wrap → sqlift_extract → sqlift_parse(desired) → sqlift_diff → sqlift_apply with the destructive-op guard exposed.'
    - sqldeep transpilation is applied inside Database.Exec / Database.Query / Database.Rows by default, mirroring the C++ Impl::transpile path. A test confirms a sqldeep-syntax SQL string (e.g. FROM ... SELECT { ... }) executes correctly via the Go API.
    - Go tests cover the new surface (FTS5, sqlift Migrate, sqldeep transpile-on-exec). go test ./go/sqlpipe/... is green.
    - sqlpipe's Go module is re-tagged (go/sqlpipe/vX.Y.0 + root vX.Y.0) so downstream consumers can go get the new API.
    context: |-
      Discovered 2026-04-29 while attempting mnemo 🎯T26 (adopt sqlpipe.Database as mnemo's SQLite layer). The sqlpipe Go wrapper currently exposes only OpenDatabase(path) with raw Exec/Query/Rows — none of the value-add features (FTS5, sqlift, sqldeep) that the C++ side provides. Without those, mnemo cannot adopt sqlpipe at all.

      Verified empirically by the T26 surveyor agent:

      1. FTS5 missing. OpenDatabase(":memory:") then CREATE VIRTUAL TABLE t USING fts5(content) fails with 'no such module: fts5'. The vendored amalgamation go/sqlpipe/internal/c/sqlite3.c contains FTS5 code, but go/sqlpipe/wrapper.go lines 7-8 do not pass -DSQLITE_ENABLE_FTS5. mnemo uses FTS5 in 16+ tables — non-negotiable.

      2. sqlift bindings not exposed. Symbols (sqlift_db_wrap, sqlift_extract, sqlift_diff, sqlift_apply, sqlift_parse, sqlift_free) are bundled into go/sqlpipe/internal/c/sqlpipe.h and linked, but no Go wrapper exists. The C++ sqlpipe::Database(path, schema_ddl) constructor that does the migration work via sqlift (dist/sqlpipe.cpp lines 4390-4465) is unreachable from Go — sqlpipe.OpenDatabase(path) only takes a path.

      3. sqldeep transpilation absent. The C++ Database::exec/query/subscribe route through Impl::transpile (sqlpipe.cpp lines 4472, 4485, 4490). The Go wrapper's Exec/Query/Rows go straight to sqlite3_exec / sqlite3_prepare_v2 without transpilation. To meet mnemo 🎯T26 acceptance criterion 4 (sqldeep transpilation active on all queries), every Exec/Query path needs transpilation by default.

      Estimated effort: ~1 focused session of careful C++/Go/cgo work plus tests and a re-tag. Downstream impact: unblocks mnemo 🎯T26 (adopt sqlpipe.Database). Without this, T26 cannot proceed without forking sqlpipe or re-implementing the bindings inline in mnemo.
    tags:
    - go-api
    - fts5
    - sqlift
    - sqldeep
    - cgo
    - downstream:mnemo
    origin: Discovered 2026-04-29 during mnemo 🎯T26 survey — sqlpipe Go wrapper missing FTS5, sqlift, sqldeep auto-transpile that mnemo needs to adopt sqlpipe.Database
    discovered: 2026-04-29
  T14:
    name: scripts/bundle-deps.sh syncs the sqlift API block in dist/sqlpipe.h automatically
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - When sqlift's public API changes (new flag macros, new error codes, new struct fields in sqlift_apply_options, version macro bumps), running scripts/bundle-deps.sh updates the corresponding section of dist/sqlpipe.h without human intervention.
    - The sqlift block in dist/sqlpipe.h (currently lines ~70-130) reflects the SQLIFT_VERSION macros, the sqlift_error_type enum, the SQLIFT_ALLOW_* flag macros, and the sqlift_apply_options struct from vendor/include/sqlift.h verbatim.
    - A test or smoke check confirms that after bumping the sqlift submodule and running bundle-deps.sh, cv test still compiles cleanly without manual edits to dist/sqlpipe.h.
    - scripts/bundle-deps.sh's docstring documents which sections of dist/sqlpipe.h it now manages.
    context: |-
      Discovered during the v0.23.0 release (sqlift bumped from v0.13.0 to v0.14.0). The bundle script copies sqlift.cpp into dist/sqlpipe.cpp but doesn't touch dist/sqlpipe.h's sqlift block — that section is hand-maintained. v0.14.0 added two new flag macros (SQLIFT_ALLOW_LOOSEN, SQLIFT_ALLOW_DATA_DEPENDENT) and updated SQLIFT_ALLOW_ALL; without manually editing dist/sqlpipe.h to match, dist/sqlpipe.cpp fails to compile because the appended sqlift_apply C wrapper references undefined SQLIFT_ALLOW_* identifiers. The next sqlift API change will hit the same gap.

      Approach: extract the relevant section of vendor/include/sqlift.h (everything between extern "C" { and the closing }, minus the function declarations sqlpipe doesn't bundle) and splice it into dist/sqlpipe.h between marker comments. Mirror the existing pattern that bundle-deps.sh uses for dist/sqlpipe.cpp (truncate at marker, append from vendor source). Apply the same to the wrapper headers (go/sqlpipe/internal/c/sqlpipe.h, swift/Sources/CSqlpipe/include/sqlpipe.h, swift/Sources/CSqlpipe/sqlpipe.h) which are copied from dist/sqlpipe.h.

      Files involved: scripts/bundle-deps.sh, dist/sqlpipe.h, vendor/include/sqlift.h.
    origin: forked from v0.23.0 release — discovered while bumping sqlift v0.13.0 → v0.14.0
    discovered: 2026-05-09
  T15:
    name: Diff sync identifies rows by PRIMARY KEY, never conflating rowid identity across databases
    status: identified
    value: 13.0
    cost: 3.0
    acceptance:
    - 'Add a test in tests/test_diff_sync.cpp: create `t(id TEXT PRIMARY KEY, v TEXT)` on both sides; insert {''a'',''b''} on master (rowids 1,2); on replica insert+delete a dummy row to advance the rowid counter, then insert {''a'',''b''} (rowids differ from master); run sync_handshake(master,replica); assert `SELECT id,v FROM t ORDER BY id` is equal and non-empty on both. Before fix: replica table is emptied (assert fails). After fix (a): the non-alias-PK table is rejected at construction with ErrorCode::WithoutRowidTable-style error; after fix (b): both sides converge.'
    - A regression test covering this case exists and passes
    context: Prevents silent, permanent loss of rows the master holds on content-identical tables whose PK is not an INTEGER-PRIMARY-KEY rowid alias, during the routine diff-sync repair path (replica falsely reports Live/in-sync). Found by Fable-5 audit 2026-07 (docs/audit/fable-2026-07.md).
    origin: manual
    discovered: 2026-07-02
  T16:
    name: Master auto-flush never streams uncommitted or rolled-back rows to replicas
    status: identified
    value: 13.0
    cost: 3.0
    acceptance:
    - 'Before: compile the repro (c++ -std=c++23 -DSQLITE_ENABLE_SESSION -DSQLITE_ENABLE_PREUPDATE_HOOK -DSQLITE_ENABLE_DESERIALIZE -Idist -Ivendor/include repro_flush.cpp build/libsqlpipe.a) — it prints ''received=1 ... LEAKED changeset seq=2 ... persisted seq=1 ... RESULT: BUG''. The repro does exec(INSERT committed) then BEGIN/INSERT/ROLLBACK and checks received.empty(). After the fix, received must be empty, master.current_seq() must stay 1, and persisted seq must equal 1. Add this as a doctest case in tests/test_master.cpp next to ''on_flush transaction rollback produces nothing'' (that existing test misses the bug because it never does a prior committed write, so flush_pending starts false).'
    - A regression test covering this case exists and passes
    context: Prevents permanent replica divergence and seq desync caused by flush_pending never being reset, which streams a later (uncommitted, rolled-back) statement's rows downstream after any committed write. Found by Fable-5 audit 2026-07 (docs/audit/fable-2026-07.md).
    origin: manual
    discovered: 2026-07-02
  T17:
    name: Diff sync honors each transmitted bucket_hi so a bucket_size mismatch never leaves rows un-diffed
    status: identified
    value: 8.0
    cost: 3.0
    acceptance:
    - 'Add a test in tests/test_diff_sync.cpp: same schema T(id INTEGER PRIMARY KEY, v), MasterConfig.bucket_size=1024, ReplicaConfig.bucket_size=4096; populate replica rowid 1..4000, leave master empty; run sync_handshake(master, replica); assert SELECT COUNT(*) FROM T on the replica == 0. Before fix the count is 2977; after fix it is 0.'
